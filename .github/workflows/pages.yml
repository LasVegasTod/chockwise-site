# Publishes chockwise.com. Runs on every push to main (site_publish.py on the server pushes after each data update).
# The airport map images are not in main's history: they live on the "images" branch, which site_publish.py replaces
# with a single commit each time. This step copies the latest ones into /airports/ before publishing, so pages show
# them as chockwise.com/airports/<code>-gates.webp (.png before Nov 10, 2026).
# Needs: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Publish chockwise.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Add the latest airport map images
        run: |
          if git ls-remote --exit-code --heads origin images >/dev/null; then
            git fetch --depth 1 origin images
            mkdir -p airports
            git archive FETCH_HEAD | tar -x -C airports
            ls airports | wc -l
          else
            echo "No images branch yet"
          fi
          rm -rf .git .github
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # deploy-pages waits at most 10 minutes (a larger `timeout` is ignored). Retrying in the same run doesn't
      # help: it reuses the commit's cancelled deployment (run 395, Nov 10, 2026), so there is one try; a
      # timed-out run is GitHub's side, and the next publish (the next push to main) puts the site up.
      # Since Nov 10, 2026 the upload is ~400 MB (map images as WebP), and deploys take ~1 minute.
      - id: deployment
        uses: actions/deploy-pages@v4
